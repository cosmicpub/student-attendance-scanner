<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>Student Check-In</title>

<script
  src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>

<style>

:root {
  --blue: #1a73e8;
  --green: #137333;
  --red: #b3261e;
  --text: #202124;
  --muted: #5f6368;
  --background: #f6f8fb;
  --border: #dadce0;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    var(--background);

  color:
    var(--text);

  font-family:
    Arial,
    sans-serif;
}

.page {
  width: min(
    650px,
    100%
  );

  margin: 0 auto;

  padding:
    20px;
}

h1 {
  margin:
    10px 0 5px;

  text-align:
    center;

  font-size:
    36px;
}

.status {
  margin-bottom:
    16px;

  text-align:
    center;

  color:
    var(--muted);

  font-size:
    17px;
}

.camera-card {
  padding:
    14px;

  background:
    white;

  border:
    1px solid
    var(--border);

  border-radius:
    18px;

  box-shadow:
    0 8px 24px
    rgba(0,0,0,.07);
}

#reader {
  width:
    100%;

  overflow:
    hidden;

  border-radius:
    14px;
}

.start-button {
  width:
    100%;

  min-height:
    60px;

  margin-top:
    12px;

  border:
    0;

  border-radius:
    12px;

  background:
    var(--blue);

  color:
    white;

  font-size:
    20px;

  font-weight:
    700;
}

.instructions {
  margin:
    15px 0;

  text-align:
    center;

  color:
    var(--muted);

  font-size:
    16px;
}

.manual {
  margin-top:
    18px;

  padding:
    16px;

  background:
    white;

  border:
    1px solid
    var(--border);

  border-radius:
    16px;
}

.manual-title {
  margin-bottom:
    10px;

  text-align:
    center;

  font-size:
    15px;

  font-weight:
    700;
}

.manual-row {
  display:
    grid;

  grid-template-columns:
    1fr auto;

  gap:
    8px;
}

.manual input {
  min-width:
    0;

  padding:
    14px;

  border:
    2px solid
    var(--border);

  border-radius:
    10px;

  text-align:
    center;

  font-size:
    28px;

  font-weight:
    700;

  letter-spacing:
    4px;
}

.manual button {
  padding:
    0 20px;

  border:
    0;

  border-radius:
    10px;

  background:
    var(--blue);

  color:
    white;

  font-weight:
    700;
}

.result-overlay {
  position:
    fixed;

  inset:
    0;

  z-index:
    100;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    25px;

  background:
    rgba(255,255,255,.96);
}

.result-box {
  width:
    min(
      500px,
      100%
    );

  padding:
    40px 25px;

  border-radius:
    22px;

  text-align:
    center;
}

.result-box.success {
  background:
    #e6f4ea;

  color:
    var(--green);
}

.result-box.error {
  background:
    #fce8e6;

  color:
    var(--red);
}

.result-icon {
  margin-bottom:
    10px;

  font-size:
    70px;
}

.result-message {
  font-size:
    30px;

  font-weight:
    700;
}

.hidden {
  display:
    none !important;
}

.closed {
  padding:
    18px;

  margin-bottom:
    15px;

  border-radius:
    12px;

  background:
    #eef3fe;

  color:
    #174ea6;

  text-align:
    center;

  font-weight:
    700;
}

</style>

</head>


<body>

<div class="page">

  <h1>
    Student Check-In
  </h1>

  <div
    id="status"
    class="status">
    Connecting…
  </div>


  <div
    id="closedMessage"
    class="closed hidden">
    Attendance is currently closed.
  </div>


  <div class="camera-card">

    <div id="reader"></div>

    <button
      id="startCameraButton"
      class="start-button"
      onclick="startCamera()">
      Start Camera
    </button>

    <div class="instructions">
      Hold your QR card in front of the camera.
    </div>

  </div>


  <div class="manual">

    <div class="manual-title">
      Can't scan? Enter your check-in code.
    </div>

    <div class="manual-row">

      <input
        id="manualCode"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="off"
        placeholder="4-digit code"
      >

      <button
        onclick="manualCheckIn()">
        Check In
      </button>

    </div>

  </div>

</div>


<div
  id="resultOverlay"
  class="result-overlay hidden">

  <div
    id="resultBox"
    class="result-box success">

    <div
      id="resultIcon"
      class="result-icon">
      ✓
    </div>

    <div
      id="resultMessage"
      class="result-message">
    </div>

  </div>

</div>




<script>

/*
 * Read the private configuration
 * from the URL fragment.
 *
 * The fragment is not sent to GitHub.
 */
const fragment =
  new URLSearchParams(
    window.location.hash
      .substring(1)
  );


const BACKEND_URL =
  fragment.get(
    'backend'
  );


const KIOSK_TOKEN =
  fragment.get(
    'k'
  );


let attendanceOpen =
  false;

let connected =
  false;

let scanner =
  null;

let cameraStarted =
  false;

let busy =
  false;

let requestCounter =
  0;


/*
 * Basic configuration check.
 */
if (
  !BACKEND_URL ||
  !KIOSK_TOKEN
) {

  document.getElementById(
    'status'
  ).textContent =
    'This kiosk link is incomplete.';

} else {

  checkAttendanceStatus();
}


/*
 * JSONP REQUEST
 *
 * This avoids CORS and avoids
 * the Apps Script iframe sandbox.
 */
function apiRequest(
  action,
  params = {}
) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        '__attendanceCallback_' +
        Date.now() +
        '_' +
        (++requestCounter);


      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      const cleanup =
        () => {

          if (finished) {
            return;
          }

          finished = true;


          if (
            script.parentNode
          ) {
            script.parentNode
              .removeChild(
                script
              );
          }


          try {
            delete window[
              callbackName
            ];
          } catch (error) {
            window[
              callbackName
            ] = undefined;
          }
        };


      window[
        callbackName
      ] =
        response => {

          cleanup();

          resolve(
            response || {}
          );
        };


      const query =
        new URLSearchParams();


      query.set(
        'api',
        action
      );


      query.set(
        'k',
        KIOSK_TOKEN
      );


      query.set(
        'callback',
        callbackName
      );


      query.set(
        '_',
        Date.now()
      );


      Object.keys(
        params
      ).forEach(
        key => {

          query.set(
            key,
            String(
              params[key]
            )
          );
        }
      );


      script.src =
        BACKEND_URL +
        '?' +
        query.toString();


      script.onerror =
        () => {

          cleanup();

          reject(
            new Error(
              'Could not reach attendance.'
            )
          );
        };


      document.head
        .appendChild(
          script
        );


      /*
       * Don't leave the screen saying
       * Connecting forever.
       */
      setTimeout(
        () => {

          if (!finished) {

            cleanup();

            reject(
              new Error(
                'Attendance connection timed out.'
              )
            );
          }

        },
        8000
      );
    }
  );
}


/*
 * CHECK WHETHER ATTENDANCE IS OPEN
 */
async function checkAttendanceStatus() {

  if (
    !BACKEND_URL ||
    !KIOSK_TOKEN ||
    busy
  ) {
    return;
  }


  try {

    const response =
      await apiRequest(
        'status'
      );


    if (
      !response.success
    ) {

      connected =
        false;

      attendanceOpen =
        false;


      document.getElementById(
        'status'
      ).textContent =
        response.message ||
        'Unable to connect to attendance.';

      return;
    }


    connected =
      true;


    attendanceOpen =
      Boolean(
        response.open
      );


    const status =
      document.getElementById(
        'status'
      );


    const closed =
      document.getElementById(
        'closedMessage'
      );


    if (
      attendanceOpen
    ) {

      status.textContent =
        response.date ||
        'Attendance is open.';


      closed.classList.add(
        'hidden'
      );

    } else {

      status.textContent =
        'Attendance Closed';


      closed.classList.remove(
        'hidden'
      );
    }


  } catch (error) {

    connected =
      false;


    document.getElementById(
      'status'
    ).textContent =
      'Unable to connect to attendance.';
  }
}


/*
 * START CAMERA
 */
async function startCamera() {

  if (
    cameraStarted
  ) {
    return;
  }


  if (
    !connected
  ) {

    alert(
      'Attendance is not connected yet. Refresh the kiosk and try again.'
    );

    return;
  }


  try {

    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(

      {
        facingMode:
          'environment'
      },

      {
        fps:
          10,

        qrbox: {
          width:
            260,

          height:
            260
        },

        formatsToSupport: [
          Html5QrcodeSupportedFormats
            .QR_CODE
        ]
      },

      decodedText => {

        if (
          busy ||
          !attendanceOpen
        ) {
          return;
        }


        processCode(
          decodedText
        );
      },

      () => {
        /*
         * Normal camera frames without
         * a QR code are ignored.
         */
      }
    );


    cameraStarted =
      true;


    document.getElementById(
      'startCameraButton'
    ).classList.add(
      'hidden'
    );


  } catch (error) {

    alert(
      'Camera could not start. Make sure camera permission is allowed for this website.'
    );
  }
}


/*
 * QR OR MANUAL CHECK-IN
 */
async function processCode(
  value
) {

  if (busy) {
    return;
  }


  if (
    !attendanceOpen
  ) {

    showResult(
      false,
      'Attendance is closed.'
    );

    return;
  }


  const code =
    String(
      value || ''
    )
      .trim()
      .toUpperCase();


  if (!code) {
    return;
  }


  busy =
    true;


  try {

    const response =
      await apiRequest(
        'checkin',
        {
          code: code
        }
      );


    if (
      response.success
    ) {

      showResult(
        true,

        response.alreadyPresent
          ? 'Already Checked In'
          : 'Checked In'
      );

    } else {

      showResult(
        false,

        response.message ||
        'Code not recognized.'
      );
    }


  } catch (error) {

    showResult(
      false,
      'Unable to reach attendance.'
    );
  }
}


/*
 * MANUAL 4-DIGIT FALLBACK
 */
function manualCheckIn() {

  const input =
    document.getElementById(
      'manualCode'
    );


  const code =
    input.value.replace(
      /\D/g,
      ''
    );


  input.value =
    '';


  processCode(
    code
  );
}


/*
 * RESULT SCREEN
 */
function showResult(
  successful,
  message
) {

  const overlay =
    document.getElementById(
      'resultOverlay'
    );


  const box =
    document.getElementById(
      'resultBox'
    );


  const icon =
    document.getElementById(
      'resultIcon'
    );


  const text =
    document.getElementById(
      'resultMessage'
    );


  box.className =
    successful
      ? 'result-box success'
      : 'result-box error';


  icon.textContent =
    successful
      ? '✓'
      : '✕';


  text.textContent =
    message;


  overlay.classList.remove(
    'hidden'
  );


  setTimeout(
    () => {

      overlay.classList.add(
        'hidden'
      );


      busy =
        false;


      /*
       * Refresh open/closed status
       * after every check-in.
       */
      checkAttendanceStatus();

    },

    successful
      ? 900
      : 1300
  );
}


/*
 * Keep fallback numeric.
 */
document.getElementById(
  'manualCode'
).addEventListener(
  'input',
  event => {

    event.target.value =
      event.target.value.replace(
        /\D/g,
        ''
      );
  }
);


document.getElementById(
  'manualCode'
).addEventListener(
  'keydown',
  event => {

    if (
      event.key ===
      'Enter'
    ) {

      event.preventDefault();

      manualCheckIn();
    }
  }
);


/*
 * Keep checking whether teacher
 * has opened or closed attendance.
 */
setInterval(
  checkAttendanceStatus,
  3000
);

</script>

</body>
</html>
