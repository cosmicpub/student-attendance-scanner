<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>Student Check-In</title>

<script
  src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>

<style>

:root {
  --blue: #1a73e8;
  --green: #137333;
  --red: #b3261e;
  --text: #202124;
  --muted: #5f6368;
  --background: #f6f8fb;
  --border: #dadce0;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background: var(--background);

  color: var(--text);

  font-family:
    Arial,
    sans-serif;
}

.page {
  width: min(
    650px,
    100%
  );

  margin: 0 auto;

  padding: 20px;
}

h1 {
  margin:
    10px 0 5px;

  text-align: center;

  font-size:
    clamp(
      32px,
      6vw,
      46px
    );
}

.status {
  margin-bottom: 16px;

  text-align: center;

  color: var(--muted);

  font-size: 18px;
}

.status.open {
  color: var(--green);
}

.status.closed {
  color: #174ea6;
}

.status.error {
  color: var(--red);
}

.closed-message {
  padding: 15px;

  margin-bottom: 15px;

  border-radius: 12px;

  background: #eef3fe;

  color: #174ea6;

  text-align: center;

  font-weight: 700;
}

.camera-card {
  padding: 14px;

  background: white;

  border:
    1px solid
    var(--border);

  border-radius: 18px;

  box-shadow:
    0 8px 24px
    rgba(0,0,0,.07);
}

#reader {
  width: 100%;

  overflow: hidden;

  border-radius: 14px;

  background: #202124;
}

.start-button {
  width: 100%;
  min-height: 64px;

  margin-top: 12px;

  border: 0;
  border-radius: 12px;

  background: var(--blue);

  color: white;

  font-size: 21px;
  font-weight: 700;

  cursor: pointer;
}

.start-button:disabled {
  opacity: .45;
  cursor: default;
}

.instructions {
  margin:
    15px 0 4px;

  text-align: center;

  color: var(--muted);

  font-size: 16px;
}

.manual {
  margin-top: 18px;

  padding: 16px;

  background: white;

  border:
    1px solid
    var(--border);

  border-radius: 16px;
}

.manual-title {
  margin-bottom: 10px;

  text-align: center;

  font-size: 15px;
  font-weight: 700;
}

.manual-row {
  display: grid;

  grid-template-columns:
    1fr auto;

  gap: 8px;
}

.manual input {
  min-width: 0;

  padding: 14px;

  border:
    2px solid
    var(--border);

  border-radius: 10px;

  text-align: center;

  font-size:
    clamp(
      25px,
      7vw,
      34px
    );

  font-weight: 700;

  letter-spacing: 4px;
}

.manual input:focus {
  outline: none;
  border-color: var(--blue);
}

.manual button {
  padding:
    0 20px;

  border: 0;
  border-radius: 10px;

  background: var(--blue);

  color: white;

  font-weight: 700;

  cursor: pointer;
}

.manual button:disabled {
  opacity: .45;
}

.result-overlay {
  position: fixed;

  inset: 0;

  z-index: 100;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 25px;

  background:
    rgba(
      255,
      255,
      255,
      .96
    );
}

.result-box {
  width: min(
    500px,
    100%
  );

  padding:
    42px 25px;

  border-radius: 22px;

  text-align: center;
}

.result-box.success {
  background: #e6f4ea;

  color: var(--green);
}

.result-box.error {
  background: #fce8e6;

  color: var(--red);
}

.result-icon {
  margin-bottom: 10px;

  font-size: 72px;
}

.result-message {
  font-size:
    clamp(
      27px,
      6vw,
      38px
    );

  font-weight: 700;
}

.result-detail {
  margin-top: 8px;

  font-size: 16px;
  font-weight: 400;
}

.hidden {
  display: none !important;
}

@media
(max-width: 520px) {

  .page {
    padding: 12px;
  }

  .camera-card,
  .manual {
    border-radius: 14px;
  }

  .manual-row {
    grid-template-columns:
      1fr;
  }

  .manual button {
    min-height: 52px;
  }
}

</style>

</head>


<body>

<div class="page">

  <h1>
    Student Check-In
  </h1>


  <div
    id="status"
    class="status"
  >
    Connecting to attendance…
  </div>


  <div
    id="closedMessage"
    class="closed-message hidden"
  >
    Attendance is currently closed.
  </div>


  <div class="camera-card">

    <div id="reader"></div>


    <button
      id="startCameraButton"
      class="start-button"
      onclick="startCamera()"
      disabled
    >
      Start Camera
    </button>


    <div class="instructions">
      Hold your QR card in front of the camera.
    </div>

  </div>


  <div class="manual">

    <div class="manual-title">
      Can't scan? Enter your 4-digit check-in code.
    </div>


    <div class="manual-row">

      <input
        id="manualCode"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="4"
        autocomplete="off"
        placeholder="4-digit code"
        disabled
      >


      <button
        id="manualButton"
        onclick="manualCheckIn()"
        disabled
      >
        Check In
      </button>

    </div>

  </div>

</div>


<div
  id="resultOverlay"
  class="result-overlay hidden"
>

  <div
    id="resultBox"
    class="result-box success"
  >

    <div
      id="resultIcon"
      class="result-icon"
    >
      ✓
    </div>


    <div
      id="resultMessage"
      class="result-message"
    >
    </div>


    <div
      id="resultDetail"
      class="result-detail"
    >
    </div>

  </div>

</div>


<script>

let connected =
  false;

let attendanceOpen =
  false;

let attendanceDate =
  '';

let scanner =
  null;

let cameraStarted =
  false;

let busy =
  false;

let requestCounter =
  0;

let pendingRequestId =
  null;

let lastStatusReceivedAt =
  0;


/*
 * This page must be opened by
 * the Google Apps Script kiosk.
 */
function hasOpener() {

  try {

    return Boolean(
      window.opener &&
      !window.opener.closed
    );

  } catch (error) {

    return Boolean(
      window.opener
    );
  }
}


/*
 * SEND MESSAGE TO GOOGLE KIOSK
 */
function sendToKiosk(
  message
) {

  if (
    !hasOpener()
  ) {
    return false;
  }


  /*
   * The Apps Script kiosk validates
   * that messages came from this
   * GitHub scanner domain.
   *
   * We use * here because Google's
   * Apps Script serving origin can vary.
   */
  window.opener.postMessage(
    message,
    '*'
  );


  return true;
}


/*
 * RECEIVE RESPONSES FROM
 * GOOGLE APPS SCRIPT KIOSK
 */
window.addEventListener(
  'message',
  event => {

    /*
     * Only accept messages from the
     * exact window that opened us.
     */
    if (
      event.source !==
      window.opener
    ) {
      return;
    }


    const data =
      event.data || {};


    /*
     * ATTENDANCE STATUS
     */
    if (
      data.type ===
      'ATTENDANCE_STATUS'
    ) {

      connected =
        true;

      attendanceOpen =
        Boolean(
          data.open
        );

      attendanceDate =
        String(
          data.date || ''
        );

      lastStatusReceivedAt =
        Date.now();


      renderAttendanceStatus();

      return;
    }


    /*
     * STUDENT CHECK-IN RESULT
     */
    if (
      data.type ===
      'CHECKIN_RESULT'
    ) {

      if (
        !pendingRequestId ||
        data.requestId !==
          pendingRequestId
      ) {
        return;
      }


      pendingRequestId =
        null;


      if (
        data.success
      ) {

        const studentName =
          String(
            data.studentName || ''
          );


        if (
          data.alreadyPresent
        ) {

          showResult(
            true,

            studentName ||
            'Already Checked In',

            'Already checked in'
          );

        } else {

          showResult(
            true,

            studentName ||
            'Checked In',

            'Present ✓'
          );
        }

      } else {

        showResult(
          false,

          data.message ||
          'Code not recognized.',

          ''
        );
      }
    }
  }
);


/*
 * UPDATE OPEN / CLOSED DISPLAY
 */
function renderAttendanceStatus() {

  const status =
    document.getElementById(
      'status'
    );


  const closed =
    document.getElementById(
      'closedMessage'
    );


  const cameraButton =
    document.getElementById(
      'startCameraButton'
    );


  const manualInput =
    document.getElementById(
      'manualCode'
    );


  const manualButton =
    document.getElementById(
      'manualButton'
    );


  if (
    !connected
  ) {

    status.className =
      'status error';

    status.textContent =
      'Unable to connect to attendance.';


    cameraButton.disabled =
      true;

    manualInput.disabled =
      true;

    manualButton.disabled =
      true;

    return;
  }


  if (
    attendanceOpen
  ) {

    status.className =
      'status open';


    status.textContent =
      attendanceDate
        ? attendanceDate
        : 'Attendance is open.';


    closed.classList.add(
      'hidden'
    );


    cameraButton.disabled =
      false;

    manualInput.disabled =
      false;

    manualButton.disabled =
      false;

  } else {

    status.className =
      'status closed';

    status.textContent =
      'Attendance Closed';


    closed.classList.remove(
      'hidden'
    );


    cameraButton.disabled =
      true;

    manualInput.disabled =
      true;

    manualButton.disabled =
      true;
  }
}


/*
 * ASK THE GOOGLE KIOSK
 * FOR CURRENT STATUS
 */
function requestStatus() {

  if (
    !hasOpener()
  ) {

    connected =
      false;

    renderAttendanceStatus();

    return;
  }


  sendToKiosk({
    type:
      'REQUEST_STATUS'
  });
}


/*
 * START QR CAMERA
 */
async function startCamera() {

  if (
    cameraStarted
  ) {
    return;
  }


  if (
    !connected ||
    !attendanceOpen
  ) {

    alert(
      'Attendance is not open.'
    );

    return;
  }


  try {

    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(

      {
        facingMode:
          'environment'
      },

      {
        fps:
          10,

        qrbox: {
          width:
            260,

          height:
            260
        },

        formatsToSupport: [
          Html5QrcodeSupportedFormats
            .QR_CODE
        ]
      },

      decodedText => {

        if (
          busy ||
          !attendanceOpen
        ) {
          return;
        }


        processCode(
          decodedText
        );
      },

      () => {
        /*
         * Normal camera frames
         * without a QR are ignored.
         */
      }
    );


    cameraStarted =
      true;


    document.getElementById(
      'startCameraButton'
    ).classList.add(
      'hidden'
    );


  } catch (error) {

    alert(
      'Camera could not start. Make sure camera permission is allowed for this website.'
    );
  }
}


/*
 * SUBMIT QR OR MANUAL CODE
 */
function processCode(
  value
) {

  if (busy) {
    return;
  }


  if (
    !connected
  ) {

    showResult(
      false,
      'Not Connected',
      'Return to the attendance kiosk and reopen the scanner.'
    );

    return;
  }


  if (
    !attendanceOpen
  ) {

    showResult(
      false,
      'Attendance Closed',
      ''
    );

    return;
  }


  const code =
    String(
      value || ''
    )
      .trim()
      .toUpperCase();


  if (!code) {
    return;
  }


  busy =
    true;


  const requestId =
    'checkin_' +
    Date.now() +
    '_' +
    (++requestCounter);


  pendingRequestId =
    requestId;


  const sent =
    sendToKiosk({
      type:
        'CHECKIN',

      requestId:
        requestId,

      code:
        code
    });


  if (!sent) {

    pendingRequestId =
      null;

    busy =
      false;


    showResult(
      false,
      'Not Connected',
      'Unable to reach the attendance kiosk.'
    );

    return;
  }


  /*
   * Avoid remaining stuck forever
   * if Apps Script never responds.
   */
  setTimeout(
    () => {

      if (
        busy &&
        pendingRequestId ===
          requestId
      ) {

        pendingRequestId =
          null;

        busy =
          false;


        showResult(
          false,
          'Check-In Timed Out',
          'Please try again.'
        );
      }

    },
    10000
  );
}


/*
 * MANUAL FALLBACK
 */
function manualCheckIn() {

  const input =
    document.getElementById(
      'manualCode'
    );


  const code =
    input.value.replace(
      /\D/g,
      ''
    );


  input.value =
    '';


  if (!code) {
    return;
  }


  processCode(
    code
  );
}


/*
 * SUCCESS / ERROR SCREEN
 */
function showResult(
  successful,
  message,
  detail
) {

  const overlay =
    document.getElementById(
      'resultOverlay'
    );


  const box =
    document.getElementById(
      'resultBox'
    );


  const icon =
    document.getElementById(
      'resultIcon'
    );


  const messageText =
    document.getElementById(
      'resultMessage'
    );


  const detailText =
    document.getElementById(
      'resultDetail'
    );


  box.className =
    successful
      ? 'result-box success'
      : 'result-box error';


  icon.textContent =
    successful
      ? '✓'
      : '✕';


  messageText.textContent =
    message;


  detailText.textContent =
    detail || '';


  overlay.classList.remove(
    'hidden'
  );


  setTimeout(
    () => {

      overlay.classList.add(
        'hidden'
      );


      busy =
        false;


      /*
       * Make sure teacher has not
       * closed attendance.
       */
      requestStatus();

    },

    successful
      ? 900
      : 1400
  );
}


/*
 * KEEP MANUAL ENTRY NUMERIC
 */
const manualInput =
  document.getElementById(
    'manualCode'
  );


manualInput.addEventListener(
  'input',
  event => {

    event.target.value =
      event.target.value
        .replace(
          /\D/g,
          ''
        )
        .slice(
          0,
          4
        );


    /*
     * Generated codes are 4 digits,
     * so manual fallback can submit
     * automatically as well.
     */
    if (
      event.target.value.length ===
        4 &&
      attendanceOpen &&
      !busy
    ) {

      const code =
        event.target.value;


      event.target.value =
        '';


      processCode(
        code
      );
    }
  }
);


manualInput.addEventListener(
  'keydown',
  event => {

    if (
      event.key ===
      'Enter'
    ) {

      event.preventDefault();

      manualCheckIn();
    }
  }
);


/*
 * INITIAL CONNECTION
 */
if (
  hasOpener()
) {

  sendToKiosk({
    type:
      'SCANNER_READY'
  });


  requestStatus();

} else {

  connected =
    false;


  document.getElementById(
    'status'
  ).className =
    'status error';


  document.getElementById(
    'status'
  ).textContent =
    'Open this scanner from the attendance kiosk.';
}


/*
 * KEEP OPEN/CLOSED STATE CURRENT
 */
setInterval(
  requestStatus,
  3000
);


/*
 * Detect if the Google kiosk tab
 * was closed after scanner opened.
 */
setInterval(
  () => {

    if (
      !hasOpener()
    ) {

      connected =
        false;

      attendanceOpen =
        false;

      renderAttendanceStatus();
    }

  },
  2000
);

</script>

</body>
</html>
